<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài khoản nhân viên — Quản trị VietTour</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="logo">Việt<span>Tour</span></div>
    <ul class="admin-nav" id="admin-nav"></ul>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 style="margin:0">Tài khoản nhân viên</h1>
      <button class="btn btn-accent" id="btn-add">+ Thêm nhân viên</button>
    </div>

    <div class="admin-panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Họ tên</th><th>Email đăng nhập</th><th>Điện thoại</th><th>Ngày tạo</th><th></th></tr>
          </thead>
          <tbody id="staff-table-body">
            <tr><td colspan="5">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- MODAL THÊM / SỬA NHÂN VIÊN -->
<div class="modal-overlay" id="staff-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title" style="margin:0">Thêm nhân viên</h2>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div id="modal-alert" class="alert"></div>

    <form id="staff-form">
      <label for="full_name">Họ và tên</label>
      <input type="text" id="full_name" required placeholder="Nguyễn Văn A">

      <label for="email">Email đăng nhập</label>
      <input type="email" id="email" required placeholder="nhanvien@tour.com">

      <label for="phone">Số điện thoại</label>
      <input type="tel" id="phone" placeholder="09xxxxxxxx">

      <label for="password" id="password-label">Mật khẩu</label>
      <input type="password" id="password" minlength="6" placeholder="Tối thiểu 6 ký tự">
      <div class="field-hint" id="password-hint"></div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px">Lưu</button>
    </form>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
requireAdmin();
renderAdminNav('/admin/staff.html');

let editingId = null;
let staffList = [];

async function loadStaff() {
  const tbody = document.getElementById('staff-table-body');
  try {
    staffList = await apiRequest('/staff');
    tbody.innerHTML = staffList.length === 0
      ? '<tr><td colspan="5">Chưa có nhân viên nào.</td></tr>'
      : staffList.map(s => `
          <tr>
            <td>${s.full_name}</td>
            <td>${s.email}</td>
            <td>${s.phone || '—'}</td>
            <td>${formatDate(s.created_at)}</td>
            <td class="table-actions">
              <button class="btn btn-outline btn-sm" data-edit="${s.id}">Sửa</button>
              <button class="btn btn-danger btn-sm" data-delete="${s.id}">Xóa</button>
            </td>
          </tr>
        `).join('');
    document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.edit)));
    document.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => removeStaff(b.dataset.delete)));
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5">Lỗi: ${err.message}</td></tr>`;
  }
}

function openAdd() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Thêm nhân viên';
  document.getElementById('staff-form').reset();
  document.getElementById('email').disabled = false;
  document.getElementById('password').required = true;
  document.getElementById('password-hint').textContent = '';
  document.getElementById('modal-alert').className = 'alert';
  document.getElementById('staff-modal').classList.add('show');
}

function openEdit(id) {
  const s = staffList.find(x => x.id == id);
  editingId = id;
  document.getElementById('modal-title').textContent = 'Sửa nhân viên';
  document.getElementById('full_name').value = s.full_name;
  document.getElementById('email').value = s.email;
  document.getElementById('email').disabled = true; // không đổi email đăng nhập
  document.getElementById('phone').value = s.phone || '';
  document.getElementById('password').value = '';
  document.getElementById('password').required = false;
  document.getElementById('password-hint').textContent = 'Để trống nếu không muốn đổi mật khẩu.';
  document.getElementById('modal-alert').className = 'alert';
  document.getElementById('staff-modal').classList.add('show');
}

function closeModal() { document.getElementById('staff-modal').classList.remove('show'); }
document.getElementById('btn-add').addEventListener('click', openAdd);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('staff-modal').addEventListener('click', (e) => { if (e.target.id === 'staff-modal') closeModal(); });

document.getElementById('staff-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById('modal-alert');
  const payload = {
    full_name: document.getElementById('full_name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    password: document.getElementById('password').value,
  };
  try {
    if (editingId) {
      await apiRequest(`/staff/${editingId}`, 'PUT', payload);
    } else {
      payload.email = document.getElementById('email').value.trim();
      await apiRequest('/staff', 'POST', payload);
    }
    closeModal();
    loadStaff();
  } catch (err) {
    showAlert(alertEl, err.message, 'error');
  }
});

async function removeStaff(id) {
  if (!confirm('Xóa tài khoản nhân viên này? Nhân viên sẽ không đăng nhập được nữa.')) return;
  try {
    await apiRequest(`/staff/${id}`, 'DELETE');
    loadStaff();
  } catch (err) {
    alert(err.message);
  }
}

loadStaff();
</script>
</body>
</html>
