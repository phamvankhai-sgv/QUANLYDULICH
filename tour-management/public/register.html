<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — VietTour</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="navbar">
    <a href="/index.html" class="logo">Việt<span>Tour</span></a>
    <ul class="nav-links">
      <li><a href="/index.html">Trang chủ</a></li>
      <li><a href="/tours.html">Tour du lịch</a></li>
    </ul>
    <div></div>
  </nav>
</header>

<div class="auth-wrap">
  <h1>Tạo tài khoản</h1>
  <p>Đăng ký để bắt đầu đặt tour du lịch yêu thích của bạn.</p>

  <div id="register-alert" class="alert"></div>

  <form id="register-form">
    <label for="full_name">Họ và tên</label>
    <input type="text" id="full_name" required placeholder="Nguyễn Văn A">

    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="ban@email.com">

    <label for="phone">Số điện thoại</label>
    <input type="tel" id="phone" placeholder="09xxxxxxxx">

    <label for="password">Mật khẩu</label>
    <input type="password" id="password" required minlength="6" placeholder="Tối thiểu 6 ký tự">

    <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px">Đăng ký</button>
  </form>

  <div class="auth-switch">
    Đã có tài khoản? <a href="/login.html">Đăng nhập</a>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById('register-alert');

  const full_name = document.getElementById('full_name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;

  try {
    await apiRequest('/auth/register', 'POST', { full_name, email, phone, password });
    showAlert(alertEl, 'Đăng ký thành công! Đang chuyển đến trang đăng nhập...', 'success');
    setTimeout(() => { window.location.href = '/login.html'; }, 1200);
  } catch (err) {
    showAlert(alertEl, err.message, 'error');
  }
});
</script>
</body>
</html>
